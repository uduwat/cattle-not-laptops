- name: Ensure secret tools are installed
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - keepassxc
  register: pkg_result
  ignore_errors: true
- name: Report package installation failures
  ansible.builtin.debug:
    msg: "{{ ('FAILED packages: ' ~ (failed_pkgs | join(', '))) if failed_pkgs else 'All packages installed' }}"
  vars:
    failed_pkgs: "{{ pkg_result.results | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='item') | list }}"
