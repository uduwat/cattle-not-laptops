- name: Ensure NetTools are installed
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - ipcalc
    - subnetcalc
    - net-tools
    - nmap
  register: pkg_result
  ignore_errors: true

- name: Report package installation failures
  ansible.builtin.debug:
    msg: "{{ ('FAILED packages: ' ~ (failed_pkgs | join(', '))) if failed_pkgs else 'All packages installed' }}"
  vars:
    failed_pkgs: "{{ pkg_result.results | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='item') | list }}"

- name: Sync fortheducksakeproxyswitch
  become_user: "{{ principaluser }}"
  ansible.builtin.git:
    repo: https://github.com/uduwat/fortheducksakeproxyswitch.git
    dest: "/home/{{ principaluser }}/.fortheducksakeproxyswitch"
  register: gitresult

- name: Show fortheducksakeproxyswitch results
  ansible.builtin.debug:
    var: gitresult