- name: Ensure Fish Shell is installed
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - fish
  register: pkg_result
  ignore_errors: true

- name: Report package installation failures
  ansible.builtin.debug:
    msg: "{{ ('FAILED packages: ' ~ (failed_pkgs | join(', '))) if failed_pkgs else 'All packages installed' }}"
  vars:
    failed_pkgs: "{{ pkg_result.results | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='item') | list }}"


- name: Ensure Shell plugins are installed
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - atuin
    - fzf
    - zoxide
    - asciinema
    - bat
    - btop
    - ccze
    - htop
  register: pkg_result
  ignore_errors: true

- name: Report package installation failures
  ansible.builtin.debug:
    msg: "{{ ('FAILED packages: ' ~ (failed_pkgs | join(', '))) if failed_pkgs else 'All packages installed' }}"
  vars:
    failed_pkgs: "{{ pkg_result.results | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='item') | list }}"
